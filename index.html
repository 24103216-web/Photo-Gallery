<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div id="image">
        Hover over an image below to display here.
    </div>

    <div class="gallery">
        <img class="preview" 
             alt="Styling with a Styling Brush" 
             src="https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=500" 
             onmouseover="upDate(this)" 
             onmouseout="unDo()">

        <img class="preview" 
             alt="With a Natural Hair Brush" 
             src="https://images.unsplash.com/photo-1560869713-7d0a29430803?w=500" 
             onmouseover="upDate(this)" 
             onmouseout="unDo()">

        <img class="preview" 
             alt="New Sprout" 
             src="https://images.unsplash.com/photo-1416879595882-3373a0480b5b?w=500" 
             onmouseover="upDate(this)" 
             onmouseout="unDo()">
    </div>

</body>
</html>
